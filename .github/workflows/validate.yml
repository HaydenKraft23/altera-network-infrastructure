name: Validate portfolio artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tools:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_inventory.py fixtures/inventory.json
      - run: python scripts/analyze_telemetry.py fixtures/telemetry.json
      - run: python tools/check_publication.py

  nginx-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse the NGINX example with throwaway test certificates
        run: |
          mkdir -p "$RUNNER_TEMP/nginx-pki"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=service.example.test' \
            -keyout "$RUNNER_TEMP/nginx-pki/frontend.key" \
            -out "$RUNNER_TEMP/nginx-pki/frontend.crt"
          cp "$RUNNER_TEMP/nginx-pki/frontend.crt" "$RUNNER_TEMP/nginx-pki/backend-ca.crt"
          docker run --rm \
            -v "$PWD/examples/nginx/private-service.conf.example:/etc/nginx/conf.d/default.conf:ro" \
            -v "$RUNNER_TEMP/nginx-pki:/etc/nginx/pki:ro" \
            nginx:stable-alpine nginx -t

  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell without contacting a target
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/Test-ServiceEndpoint.ps1'),
            [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
